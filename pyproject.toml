[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app-ads-sync"
version = "2.1.0"
description = "Sync and merge missing app-ads.txt records from Clever Ads Solutions (CAS.AI) API"
readme = "README.md"
authors = [
    { name = "Vasily", email = "poulgray63@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.7"
keywords = ["app-ads-txt", "ads-txt", "cas", "clever-ads-solutions", "admob", "applovin", "mediation", "adtech"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/pou1gray/App-ads-txt-Sync"
Repository = "https://github.com/pou1gray/App-ads-txt-Sync.git"
Issues = "https://github.com/pou1gray/App-ads-txt-Sync/issues"

[project.scripts]
app-ads-sync = "sync:main"
